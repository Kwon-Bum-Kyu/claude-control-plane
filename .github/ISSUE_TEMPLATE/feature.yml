name: 기능 제안
description: CCP에 추가할 기능이나 개선 사항을 제안합니다
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        신고하기 전에 먼저 기존 이슈를 검색해 주세요. 이미 같은 제안이 등록되어 있을 수 있습니다.
        MVP는 의도적으로 범위가 좁으므로, 사소하지 않은 추가 기능에는 범위를 정당화하는 근거가 필요합니다.

  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 어떤 사용자 체감 불편이 이 요청의 동기인가요? 가능하면 실패하는 작업 흐름을 그대로 인용해 주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 변경
      description: 기능의 구체적인 형태를 적어 주세요. 슬래시 커맨드 이름, 플래그, 훅 등입니다.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안
      description: 검토했지만 채택하지 않은 다른 접근과 그 이유를 적어 주세요.

  - type: dropdown
    id: scope
    attributes:
      label: 영향받는 표면
      multiple: true
      options:
        - 라우터(4축 결정)
        - 슬래시 커맨드(`/ccp:antigravity-*` 또는 `/ccp:codex-*`)
        - 훅(UserPromptSubmit / PreCompact / SessionStart / SubagentStop)
        - companion 스크립트(Antigravity 또는 Codex)
        - 감사(`/ccp:audit`)
        - 서브에이전트(antigravity-rescue / codex-rescue / router)
        - 문서
        - 그 밖
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 합격 기준
      description: 이 제안이 완료되었다는 것을 어떻게 확인하나요? 가능하면 측정 가능한 조건으로 적어 주세요.
      placeholder: |
        - router-eval에 케이스 5개가 추가되고 전부 통과합니다
        - canonical 토큰 절감 효과가 기존 기준 대비 5% 이내로 유지됩니다

  - type: checkboxes
    id: principles
    attributes:
      label: 아키텍처 원칙
      description: 이 제안이 건드리는 원칙이 있다면 표시해 주세요.
      options:
        - label: "자동 fallback 금지 원칙: 위임 실패를 main Claude로 자동 재시도하지 않습니다"
        - label: "서브에이전트 격리 원칙: 서브에이전트가 메인 컨텍스트로 내용을 누출하지 않습니다"
        - label: 그 밖의 원칙(설명에 적어 주세요)
