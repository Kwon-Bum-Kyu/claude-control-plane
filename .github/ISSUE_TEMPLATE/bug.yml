name: 버그 신고
description: CCP 의 결함을 신고합니다(라우터 결정, 슬래시 커맨드, 훅, 감사, envelope 등)
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        버그를 신고해 주셔서 감사합니다. CCP 는 여러 외부 CLI(Claude Code, Antigravity CLI, Codex CLI)를 감싸므로
        정확한 환경 정보가 있어야 원인을 파악할 수 있습니다.

  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 결함을 한 문장으로 설명해 주세요.
      placeholder: "/ccp:antigravity-rescue 가 한글 코드 블록이 포함된 프롬프트에서 ENOENT 를 반환합니다"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 절차
      description: 최소 재현 절차를 적어 주세요. 실행한 슬래시 커맨드나 셸 명령을 그대로 포함해 주세요.
      placeholder: |
        1. `/ccp:antigravity-rescue --background "50KB 로그 요약"`
        2. 상태가 `running` 으로 바뀔 때까지 기다립니다
        3. envelope.exit_code == 1 을 확인합니다
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 결과와 실제 결과
      description: 무엇을 기대했고, 실제로 무엇을 관찰했나요?
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS / 커널
      description: "예: macOS 15.1 (Darwin 24.1.0), Ubuntu 22.04 (Linux 6.5.0)"
      placeholder: macOS 15.1 (Darwin 24.1.0)
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js 버전
      description: "`node --version` 의 출력입니다. CCP 는 Node.js 20.19 이상(22 계열은 22.7 이상)을 요구합니다."
      placeholder: v22.12.0
    validations:
      required: true

  - type: input
    id: claude_code
    attributes:
      label: Claude Code 버전
      description: "`claude --version` 의 출력입니다."
      placeholder: 1.x.x
    validations:
      required: true

  - type: input
    id: antigravity_cli
    attributes:
      label: Antigravity CLI 버전
      description: "`agy --version` 의 출력입니다. 쓰지 않았다면 비워 둡니다."
      placeholder: 1.0.x

  - type: input
    id: codex_cli
    attributes:
      label: Codex CLI 버전
      description: "`codex --version` 의 출력입니다. 쓰지 않았다면 비워 둡니다."
      placeholder: 0.x.x

  - type: textarea
    id: envelope
    attributes:
      label: envelope 또는 에러 출력
      description: 실패한 커맨드가 반환한 JSON envelope(또는 에러 로그)를 붙여넣어 주세요. 비밀 값은 지워 주세요.
      render: json

  - type: checkboxes
    id: checks
    attributes:
      label: 사전 확인
      options:
        - label: "`/ccp:antigravity-setup`(필요하면 `/ccp:codex-setup` 도)을 실행했고 인증 상태가 정상입니다"
          required: true
        - label: 최신 `main` 브랜치에서도 같은 문제가 재현됨을 확인했습니다
          required: true
